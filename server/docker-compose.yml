# Servidor InfraDev Remote (base: RustDesk Server OSS + API do catálogo de endereços)
# Uso: ajuste o .env e rode: docker compose up -d
services:
  hbbs: # servidor de IDs: registra as máquinas e faz o encontro entre elas
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r ${PUBLIC_HOST}:21117 -k _
    volumes: ["./data:/root"]
    network_mode: host
    depends_on: [hbbr]
    restart: unless-stopped

  hbbr: # relay: repassa a conexão quando não dá para ligar as máquinas direto
    image: rustdesk/rustdesk-server:latest
    command: hbbr -k _
    volumes: ["./data:/root"]
    network_mode: host
    restart: unless-stopped

  api: # painel web + catálogo de endereços sincronizado (lejianwen/rustdesk-api)
    image: lejianwen/rustdesk-api:latest
    environment:
      - TZ=America/Sao_Paulo
      - RUSTDESK_API_LANG=pt-BR
      - RUSTDESK_API_RUSTDESK_ID_SERVER=${PUBLIC_HOST}:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=${PUBLIC_HOST}:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://${PUBLIC_HOST}:21114
      - RUSTDESK_API_RUSTDESK_KEY_FILE=/app/data/keys/id_ed25519.pub
    volumes:
      - ./api-data:/app/data
      - ./data:/app/data/keys:ro
    ports: ["21114:21114"]
    restart: unless-stopped
